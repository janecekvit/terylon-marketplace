# Coverage of the Node test suites, uploaded by the Unit suites job in .github/workflows/ci.yml.
# Informational: a drop in coverage is reported, never a failed check.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "tests/**/stubs/**"
  - "**/fixtures/**"
  - "**/fixtures.*"

comment:
  layout: "condensed_header, condensed_files"
  require_changes: true
