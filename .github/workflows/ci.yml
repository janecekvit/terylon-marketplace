# Every pull request and every push to main: the unit suites, the end-to-end harness's free
# install stage, and the terylon-pane mod's own tests with their teeth. The model-driven stages
# (author, github-only) are not run here — they need a Claude login and cost about $3 a run;
# the README says why, under "Continuous integration".
#
# Every action is pinned to a full commit SHA, with its release in a comment; Dependabot raises
# them. Every checkout leaves no credential behind (persist-credentials: false).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token: write lets the Codecov upload authenticate by OIDC, so no Codecov token is stored.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Two reporters: spec to the log, as before, and lcov to lcov.info for Codecov.
      - name: node --test, with coverage
        run: >-
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          "**/*.test.js"

      # Informational only: codecov.yml sets no gate, and an unreachable Codecov does not fail CI.
      # Forks skip it; the repository has to be enabled on codecov.io for an upload to land.
      - name: Upload coverage to Codecov
        if: github.repository == 'janecekvit/terylon-marketplace'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          fail_ci_if_error: false

  install:
    name: End-to-end install stage (free, no model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The Claude Code the install stage and the mod's tests were last measured against, pinned
      # exactly in .github/claude-code/package.json and installed from its lockfile, every package
      # checked against its integrity hash. Dependabot raises it; CLAUDE.md, under "Testing", says
      # which version was measured and when.
      # A line added to GITHUB_PATH reaches the later steps only, so this one names the binary.
      - name: Install Claude Code from the lockfile
        working-directory: .github/claude-code
        run: |
          npm ci --no-audit --no-fund
          node_modules/.bin/claude --version
          echo "${GITHUB_WORKSPACE}/.github/claude-code/node_modules/.bin" >> "${GITHUB_PATH}"

      # marketplace add installs a branch or a tag, never a commit, and a CI checkout is a detached
      # HEAD. Name the checked-out commit as a local branch and install that branch.
      - name: Name the commit under test
        run: git switch --create ci/under-test

      # No Claude login and no forge token exist here, and none is needed: the stage installs into
      # a scratch CLAUDE_CONFIG_DIR and reads the init event, which arrives before any API call.
      - name: node tests/e2e/run.js --stages install
        run: node tests/e2e/run.js --source . --ref ci/under-test --stages install --out "${RUNNER_TEMP}/e2e"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-install-report
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  # Whether the terylon-pane mod's mutation and zone suites run (#42): about a hundred runs of plugin test, which most
  # pull requests cannot affect. tests/terylon-pane/needs-pane-suites.js decides, from the paths the pull request
  # changes, and the Unit suites job tests it. A push to main, or a run started by hand, always runs them.
  pane-plan:
    name: terylon-pane plan (which suites run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # The whole history, so the diff below reaches the merge base of any pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Three dots: what the pull request changes since it left its base, not what the base gained meanwhile.
      # The diff is written to a file first, so a failed diff fails this step rather than reading as "no change".
      - name: Decide from the changed paths
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]
          then
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/changed.txt"
            node tests/terylon-pane/needs-pane-suites.js --event "${EVENT_NAME}" --changed "${RUNNER_TEMP}/changed.txt"
          else
            node tests/terylon-pane/needs-pane-suites.js --event "${EVENT_NAME}"
          fi

  # The mutation suite in six shards, each on a runner of its own; within a shard the runs stay one after another,
  # since acts.test.ts sometimes fails under full CPU load. tests/terylon-pane/shard.test.js proves the six
  # cover every mutation exactly once. Each shard also runs the unmutated baseline, so its reds mean something.
  pane-mutations:
    name: terylon-pane mutations (shard ${{ matrix.shard }}/6)
    needs: pane-plan
    if: needs.pane-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # About 28 runs of plugin test each; four shards of 41 ran 28 to 30 minutes and one hit this limit, so six it is.
    # The README's CI table carries the measurement.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code from the lockfile
        working-directory: .github/claude-code
        run: |
          npm ci --no-audit --no-fund
          node_modules/.bin/claude --version
          echo "${GITHUB_WORKSPACE}/.github/claude-code/node_modules/.bin" >> "${GITHUB_PATH}"

      # Each planted mutation must turn the mod's tests red; with claude on PATH none of them skips.
      - name: node --test tests/terylon-pane/mutations.test.js
        env:
          MUTATION_SHARD: ${{ matrix.shard }}/6
        run: node --test tests/terylon-pane/mutations.test.js

  # Three runs of plugin test, about a minute: a job of its own beside the shards rather than a fifth of their time.
  pane-zones:
    name: terylon-pane zones
    needs: pane-plan
    if: needs.pane-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code from the lockfile
        working-directory: .github/claude-code
        run: |
          npm ci --no-audit --no-fund
          node_modules/.bin/claude --version
          echo "${GITHUB_WORKSPACE}/.github/claude-code/node_modules/.bin" >> "${GITHUB_PATH}"

      # The runner is UTC, and plugin test runs in UTC on Linux whatever TZ says: each zone is planted in a copy (#39).
      - name: node --test tests/terylon-pane/zones.test.js
        run: node --test tests/terylon-pane/zones.test.js

  # The check main's ruleset requires, by this exact name: rename it and every pull request waits on a check that never
  # comes. It runs validate and plugin test itself, then reports for the plan, the shards and the zones: red if any of
  # them failed or was cancelled, green when they ran green or when the plan skipped them for an untouched pane.
  # !cancelled() rather than always(): it runs whatever its needs concluded, but not for a run superseded by a newer push.
  pane:
    name: terylon-pane mod (validate, test, mutations)
    needs: [pane-plan, pane-mutations, pane-zones]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code from the lockfile
        working-directory: .github/claude-code
        run: |
          npm ci --no-audit --no-fund
          node_modules/.bin/claude --version
          echo "${GITHUB_WORKSPACE}/.github/claude-code/node_modules/.bin" >> "${GITHUB_PATH}"

      # What the module hooks, calls, reads and writes: the list a reviewer checks against the README.
      - name: claude plugin validate plugins/terylon-pane
        run: claude plugin validate plugins/terylon-pane

      - name: claude plugin test plugins/terylon-pane
        run: claude plugin test plugins/terylon-pane

      # A matrix job's result is its shards' together: failure if any failed, cancelled if any was.
      - name: The plan, the shards and the zones
        env:
          PLAN_RESULT: ${{ needs.pane-plan.result }}
          RUN_SUITES: ${{ needs.pane-plan.outputs.run }}
          MUTATIONS_RESULT: ${{ needs.pane-mutations.result }}
          ZONES_RESULT: ${{ needs.pane-zones.result }}
        run: |
          echo "plan: ${PLAN_RESULT} (run=${RUN_SUITES}); mutations: ${MUTATIONS_RESULT}; zones: ${ZONES_RESULT}"

          if [ "${PLAN_RESULT}" != "success" ]
          then
            echo "::error::the plan did not succeed (${PLAN_RESULT}), so nothing says whether the suites had to run"
            exit 1
          fi

          if [ "${RUN_SUITES}" = "true" ]
          then
            if [ "${MUTATIONS_RESULT}" != "success" ] || [ "${ZONES_RESULT}" != "success" ]
            then
              echo "::error::the suites had to run: mutations ${MUTATIONS_RESULT}, zones ${ZONES_RESULT}"
              exit 1
            fi

            echo "the mutation suite's six shards and the zone suite passed"
          elif [ "${RUN_SUITES}" = "false" ]
          then
            echo "the mutation and zone suites were skipped: the pull request touches nothing they can see"
          else
            echo "::error::the plan gave no answer (run=${RUN_SUITES})"
            exit 1
          fi
