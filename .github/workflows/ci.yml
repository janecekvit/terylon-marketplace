# Every pull request and every push to main: the unit suites, then the end-to-end harness's free
# install stage. The model-driven stages (author, github-only) are not run here — they need a
# Claude login and cost about $3 a run; the README says why, under "Continuous integration".
#
# Every action is pinned to a full commit SHA, with its release in a comment; Dependabot raises
# them. Every checkout leaves no credential behind (persist-credentials: false).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Claude Code the install stage was last measured against. Raise it deliberately, in its own
  # commit, after the stage passes locally on the new version.
  CLAUDE_CODE_VERSION: 2.1.289

jobs:
  unit:
    name: Unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token: write lets the Codecov upload authenticate by OIDC, so no Codecov token is stored.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Two reporters: spec to the log, as before, and lcov to lcov.info for Codecov.
      - name: node --test, with coverage
        run: >-
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          "**/*.test.js"

      # Informational only: codecov.yml sets no gate, and an unreachable Codecov does not fail CI.
      # Forks skip it; the repository has to be enabled on codecov.io for an upload to land.
      - name: Upload coverage to Codecov
        if: github.repository == 'janecekvit/terylon-marketplace'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          fail_ci_if_error: false

  install:
    name: End-to-end install stage (free, no model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # marketplace add installs a branch or a tag, never a commit, and a CI checkout is a detached
      # HEAD. Name the checked-out commit as a local branch and install that branch.
      - name: Name the commit under test
        run: git switch --create ci/under-test

      # No Claude login and no forge token exist here, and none is needed: the stage installs into
      # a scratch CLAUDE_CONFIG_DIR and reads the init event, which arrives before any API call.
      - name: node tests/e2e/run.js --stages install
        run: node tests/e2e/run.js --source . --ref ci/under-test --stages install --out "${RUNNER_TEMP}/e2e"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-install-report
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
