# Dependabot raises the pinned GitHub Actions once a week, one pull request for all of them, and
# the Claude Code CI runs, locked in .github/claude-code/. The marketplace ships no npm, NuGet or
# pip dependency of its own; the tests use Node's standard library only.
version: 2
updates:
  # Every update waits 14 days after its release (cooldown), so a compromised release has time
  # to be caught before it reaches this repository. Actions are pinned to commit SHAs; Dependabot
  # updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Build(deps)"

  # The Claude Code CI installs with npm ci. A raise is a measurement: the pull request's CI runs
  # the install stage and the terylon-pane tests on the new version, and CLAUDE.md, under
  # "Testing", records the version and date once it lands.
  - package-ecosystem: npm
    directory: /.github/claude-code
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: "Build(deps)"
