# Dependabot raises the pinned GitHub Actions once a week, one pull request for all of them.
# The marketplace ships no npm, NuGet or pip dependency of its own; the tests use Node's standard
# library only.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Build(deps)"
